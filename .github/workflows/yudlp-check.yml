## yudlp 稼働状況チェック (構文修正版)

`.github/workflows/yudlp-check.yml` として保存してください。

```yaml
name: yudlp Status Monitor

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  check-api:
    runs-on: ubuntu-latest
    steps:
      - name: Send Request to yudlp
        run: |
          TEST_ID="BaW_jenozKc"
          TARGET_URL="[https://yudlp.vercel.app/stream/$TEST_ID](https://yudlp.vercel.app/stream/$TEST_ID)"
          
          echo "Checking URL: $TARGET_URL"
          
          RESPONSE=$(curl -o /dev/null -s -w "%{http_code}" -L "$TARGET_URL")
          
          echo "Status Code: $RESPONSE"
          
          if [ "$RESPONSE" -eq 200 ]; then
            echo "Result: Online"
          else
            echo "Result: Offline or Error ($RESPONSE)"
            exit 1
          fi
