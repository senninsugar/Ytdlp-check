name: yudlp-status-monitor

"on":
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  check-api:
    runs-on: ubuntu-latest
    steps:
      - name: Send Request
        run: |
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" -L "https://yudlp.vercel.app/stream/BaW_jenozKc")
          echo "Status: $STATUS"
          if [ "$STATUS" -eq 200 ]; then
            echo "API is up"
          else
            echo "API is down"
            exit 1
          fi
