## yudlp 稼働状況チェック (再修正版)

`.github/workflows/yudlp-check.yml` として保存してください。

```yaml
name: yudlp-status-monitor

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

jobs:
  check-api:
    runs-on: ubuntu-latest
    steps:
      - name: Check Endpoint
        run: |
          # 確実に存在する動画IDでテスト
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" -L "[https://yudlp.vercel.app/stream/BaW_jenozKc](https://yudlp.vercel.app/stream/BaW_jenozKc)")
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" -eq 200 ]; then
            exit 0
          else
            exit 1
          fi
