Name: yudlp-status-monitor

"on":
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  check-api:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Send Request
        id: check
        run: |
          TIMESTAMP=$(date -u -d "+9 hours" '+%Y-%m-%d %H:%M:%S')
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
          
          TEST_ID="BaW_jenozKc"

          YUDLP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" -L "https://yudlp.vercel.app/stream/$TEST_ID")
          echo "yudlp_code=$YUDLP_STATUS" >> $GITHUB_OUTPUT
          if [ "$YUDLP_STATUS" -eq 200 ]; then
            echo "yudlp_result=稼働中" >> $GITHUB_OUTPUT
          else
            echo "yudlp_result=ダウン中" >> $GITHUB_OUTPUT
          fi

          SENNIN_STATUS=$(curl -o /dev/null -s -w "%{http_code}" -L "https://senninytdlp.vercel.app/")
          echo "sennin_code=$SENNIN_STATUS" >> $GITHUB_OUTPUT
          if [ "$SENNIN_STATUS" -eq 200 ] || [ "$SENNIN_STATUS" -eq 404 ]; then
            echo "sennin_result=稼働中" >> $GITHUB_OUTPUT
          else
            echo "sennin_result=ダウン中" >> $GITHUB_OUTPUT
          fi

          MIN_RAW_RESPONSE=$(curl -s -L "https://min-tube2-api.vercel.app/status")
          MIN_HTTP_CODE=$(curl -o /dev/null -s -w "%{http_code}" -L "https://min-tube2-api.vercel.app/status")
          echo "min_code=$MIN_HTTP_CODE" >> $GITHUB_OUTPUT
          if echo "$MIN_RAW_RESPONSE" | grep -iq "ok"; then
            echo "min_result=稼働中" >> $GITHUB_OUTPUT
          else
            echo "min_result=ダウン中" >> $GITHUB_OUTPUT
          fi

          SIA_STATUS=$(curl -o /dev/null -s -w "%{http_code}" --max-time 30 -L "https://siawaseok.f5.si/api/streams/$TEST_ID")
          echo "sia_code=$SIA_STATUS" >> $GITHUB_OUTPUT
          if [ "$SIA_STATUS" -ne 000 ]; then
            echo "sia_result=稼働中" >> $GITHUB_OUTPUT
          else
            echo "sia_result=ダウン中" >> $GITHUB_OUTPUT
          fi

      - name: Update Logs and JSON
        run: |
          mkdir -p data logs all
          TIMESTAMP="${{ steps.check.outputs.timestamp }}"

          YUDLP_RESULT="${{ steps.check.outputs.yudlp_result }}"
          YUDLP_CODE="${{ steps.check.outputs.yudlp_code }}"
          echo "{\"last_check\": \"$TIMESTAMP\", \"status\": \"$YUDLP_RESULT\", \"code\": $YUDLP_CODE}" > data/yudlp.json
          
          YUDLP_LOG="logs/yudlp.md"
          if [ ! -f "$YUDLP_LOG" ]; then
            echo "| 日時 (JST) | 状態 | ステータスコード |" > $YUDLP_LOG
            echo "| --- | --- | --- |" >> $YUDLP_LOG
          fi
          echo "| $TIMESTAMP | $YUDLP_RESULT | $YUDLP_CODE |" >> $YUDLP_LOG

          SENNIN_RESULT="${{ steps.check.outputs.sennin_result }}"
          SENNIN_CODE="${{ steps.check.outputs.sennin_code }}"
          echo "{\"last_check\": \"$TIMESTAMP\", \"status\": \"$SENNIN_RESULT\", \"code\": $SENNIN_CODE}" > data/sennin.json
          
          SENNIN_LOG="logs/sennin.md"
          if [ ! -f "$SENNIN_LOG" ]; then
            echo "| 日時 (JST) | 状態 | ステータスコード |" > $SENNIN_LOG
            echo "| --- | --- | --- |" >> $SENNIN_LOG
          fi
          echo "| $TIMESTAMP | $SENNIN_RESULT | $SENNIN_CODE |" >> $SENNIN_LOG

          MIN_RESULT="${{ steps.check.outputs.min_result }}"
          MIN_CODE="${{ steps.check.outputs.min_code }}"
          echo "{\"last_check\": \"$TIMESTAMP\", \"status\": \"$MIN_RESULT\", \"code\": $MIN_CODE}" > data/min.json
          
          MIN_LOG="logs/min.md"
          if [ ! -f "$MIN_LOG" ]; then
            echo "| 日時 (JST) | 状態 | ステータスコード |" > $MIN_LOG
            echo "| --- | --- | --- |" >> $MIN_LOG
          fi
          echo "| $TIMESTAMP | $MIN_RESULT | $MIN_CODE |" >> $MIN_LOG

          SIA_RESULT="${{ steps.check.outputs.sia_result }}"
          SIA_CODE="${{ steps.check.outputs.sia_code }}"
          echo "{\"last_check\": \"$TIMESTAMP\", \"status\": \"$SIA_RESULT\", \"code\": $SIA_CODE}" > data/sia.json
          
          SIA_LOG="logs/sia.md"
          if [ ! -f "$SIA_LOG" ]; then
            echo "| 日時 (JST) | 状態 | ステータスコード |" > $SIA_LOG
            echo "| --- | --- | --- |" >> $SIA_LOG
          fi
          echo "| $TIMESTAMP | $SIA_RESULT | $SIA_CODE |" >> $SIA_LOG

          echo "{\"last_update\": \"$TIMESTAMP\", \"apis\": [{\"name\": \"yudlp\", \"status\": \"$YUDLP_RESULT\"}, {\"name\": \"sennin\", \"status\": \"$SENNIN_RESULT\"}, {\"name\": \"min\", \"status\": \"$MIN_RESULT\"}, {\"name\": \"sia\", \"status\": \"$SIA_RESULT\"}]}" > all/all.json

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/yudlp.json logs/yudlp.md data/sennin.json logs/sennin.md data/min.json logs/min.md data/sia.json logs/sia.md all/all.json
          git commit -m "Update status: yudlp(${{ steps.check.outputs.yudlp_result }}), sennin(${{ steps.check.outputs.sennin_result }}), min(${{ steps.check.outputs.min_result }}), sia(${{ steps.check.outputs.sia_result }})" || exit 0
          git push
